        function toggleMenu() {
            const dropdown = document.getElementById('dropdown');
            const hamburger = document.querySelector('.hamburger');
            dropdown.classList.toggle('open');
            hamburger.classList.toggle('active');
        }

        function allerPageAleatoire() {
            const nombre = Math.floor(Math.random() * 100) + 1;
            window.location.href = 'Pages.html?n=' + nombre;
        }

        function allerPageChoisie() {
            const val = parseInt(document.getElementById('pageInput').value);
            if (val >= 1 && val <= 100) {
                window.location.href = 'Pages.html?n=' + val;
            } else {
                document.getElementById('pageInput').classList.add('input-error');
                setTimeout(() => document.getElementById('pageInput').classList.remove('input-error'), 600);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement.id === 'pageInput') allerPageChoisie();
        });

        // Lire le paramètre n dans l'URL
        const params = new URLSearchParams(window.location.search);
        const n = parseInt(params.get('n'));

        // Vérifier que le numéro est valide
        if (!n || n < 1 || n > 100 || !pages[n]) {
            document.getElementById('titre').textContent = "Page introuvable";
            document.getElementById('contenu').textContent = "Ce numéro de page n'existe pas. Reviens à l'accueil.";
            document.getElementById('numeroBadge').textContent = "?";
        } else {
            document.title = "Page " + n;
            document.getElementById('numeroBadge').textContent = n;
            document.getElementById('titre').textContent = pages[n].titre;
            document.getElementById('contenu').textContent = pages[n].contenu;
        }
